<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scan Van QR</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    #reader {
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
    }
    .info {
      font-size: 1rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>📷 Scan Van QR Code</h2>
  <p class="info">Please allow camera and location access.</p>
  <div id="reader"></div>

  <!-- Request location on page load -->
  <script>
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        sessionStorage.setItem("latitude", pos.coords.latitude);
        sessionStorage.setItem("longitude", pos.coords.longitude);
      },
      (err) => {
        alert("⚠️ Location access denied. Trip may not be logged correctly.");
      }
    );
  </script>

  <!-- QR Scanner -->
  <script>
    function onScanSuccess(qrMessage) {
      const lat = sessionStorage.getItem("latitude");
      const lng = sessionStorage.getItem("longitude");

      let redirectURL = qrMessage;
      if (lat && lng) {
        const hasQuery = qrMessage.includes("?");
        redirectURL += hasQuery ? `&` : `?`;
        redirectURL += `lat=${lat}&lng=${lng}`;
      }

      window.location.href = redirectURL;
    }

    function onScanError(errorMessage) {
      // Optionally log scan errors here
    }

    const html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };

    Html5Qrcode.getCameras().then(devices => {
      if (devices && devices.length) {
        html5QrCode.start(
          { facingMode: "environment" },
          config,
          onScanSuccess,
          onScanError
        );
      } else {
        alert("No camera found or permission denied.");
      }
    }).catch(err => {
      alert("Camera access error: " + err);
    });
  </script>
</body>
</html>
