<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Attendance Viewer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header>
    <div class="logo">🚌 Track Way</div>
    <nav>
      <a href="{{ url_for('home') }}">Dashboard</a>
      <a href="{{ url_for('trip_logger') }}">Trip Logger</a>
      <a href="{{ url_for('view_logs_page') }}">View Logs</a>
      <a href="{{ url_for('attendance') }}">Attendance</a>
      <a href="{{ url_for('attendance_viewer') }}">Attendance Viewer</a>
      <a href="{{ url_for('admin_login_page') }}">Admin</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>View Monthly Attendance</h1>
      <p>Select a van, month, and year to view attendance records.</p>
    </section>

    <section class="form-section">
      <div class="form-box">
        <label for="van_id">Van ID:</label>
        <input type="text" id="van_id" class="input-box" placeholder="Enter Van ID" />

        <label for="month">Select Month:</label>
        <select id="month" class="input-box">
          <option value="january">January</option>
          <option value="february">February</option>
          <option value="march">March</option>
          <option value="april">April</option>
          <option value="may">May</option>
          <option value="june">June</option>
          <option value="july">July</option>
          <option value="august">August</option>
          <option value="september">September</option>
          <option value="october">October</option>
          <option value="november">November</option>
          <option value="december">December</option>
        </select>

        <label for="year">Enter Year:</label>
        <input type="text" id="year" class="input-box" placeholder="Enter year" />

        <button class="glow-button" onclick="loadAttendance()">View Attendance</button>
      </div>
    </section>

   <section class="form-section">
  <div class="form-box" id="attendance_result" style="overflow-x: auto; display: none;"></div>
</section>

  </main>

  <footer>
    <p>&copy; 2025 SAAC Softwares. All rights reserved.</p>
    <p style="text-align:center; padding: 15px 0; font-size: 14px; color: #666;">
      Contact us: <a href="mailto:saacsoftwares@gmail.com">saacsoftwares@gmail.com</a>
    </p>
  </footer>

  <script>
    function loadAttendance() {
      const van_id = document.getElementById("van_id").value.trim().toUpperCase();
      const month = document.getElementById("month").value;
      const year = document.getElementById("year").value.trim();
      const resultBox = document.getElementById("attendance_result");

      if (!van_id || !year) {
        resultBox.innerHTML = "<p>Please enter all fields.</p>";
        return;
      }

      fetch(`/view_attendance?van_id=${van_id}&month=${month}&year=${year}`)
        .then(res => res.text())
        .then(data => {
  resultBox.innerHTML = data;
  resultBox.style.display = "block";
})

        .catch(() => resultBox.innerHTML = "<p>Unable to load attendance. Check server or file.</p>");
    }
  </script>
</body>
</html>
