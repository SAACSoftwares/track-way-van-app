<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forgot Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <style>
    .glow-button {
      border: 2px solid black;
      padding: 10px 20px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
      transition: box-shadow 0.3s ease;
    }

    .glow-button:hover {
      box-shadow: 0 0 10px #007bff;
    }

    input[type="email"], input[type="text"], input[type="password"] {
      border: 2px solid black;
      padding: 10px;
      border-radius: 4px;
      width: 100%;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    .form-box {
      max-width: 400px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">🚌 Track Way</div>
    <nav>
      <a href="{{ url_for('home') }}">Dashboard</a>
      <a href="{{ url_for('admin_login_page') }}">Admin</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Forgot Password</h1>
      <p>Enter your email to receive an OTP.</p>
    </section>

    <section class="form-section">
      <div class="form-box">
        <label>Email:</label>
        <input type="email" id="email" placeholder="Enter registered email" />
        <button class="glow-button" onclick="sendOTP()">Send OTP</button>
        <p id="otp_status" style="text-align:center; color: green;"></p>
      </div>
    </section>

    <section class="form-section" id="otpSection" style="display: none; text-align: center;">
      <div class="form-box" style="margin: 0 auto;">
        <label>Enter OTP:</label>
        <input type="text" id="otp" />
        <label>New Password:</label>
        <input type="password" id="new_password" />
        <button class="glow-button" onclick="resetPassword()">Reset Password</button>
        <p id="reset_status" style="text-align:center;"></p>
      </div>
    </section>
  </main>
    <footer>
    <p style="text-align: center;">&copy; 2025 SAAC Softwares. All rights reserved.</p>
  </footer>
  <script>
    function sendOTP() {
      const email = document.getElementById("email").value.trim();
      fetch("/send_otp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById("otp_status").innerText = data.message || data.error;
        if (data.success) document.getElementById("otpSection").style.display = "block";
      });
    }

    function resetPassword() {
      const email = document.getElementById("email").value.trim();
      const otp = document.getElementById("otp").value.trim();
      const newPassword = document.getElementById("new_password").value.trim();

      fetch("/reset_password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, otp, new_password: newPassword })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById("reset_status").innerText = data.message || data.error;
      });
    }
  </script>
</body>
</html>
