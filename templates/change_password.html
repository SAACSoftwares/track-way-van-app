<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Change Admin Password</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .form-box {
      max-width: 400px;
      margin: 50px auto;
      padding: 30px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .form-box input {
      width: 100%;
      padding: 10px;
      margin: 8px 0 16px;
      font-size: 16px;
      border: 2px solid black;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .form-box button {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      font-weight: bold;
      background: white;
      color: black;
      border: 2px solid black;
      border-radius: 5px;
      cursor: pointer;
      transition: box-shadow 0.3s ease;
    }

    .form-box button:hover {
      box-shadow: 0 0 10px #007bff;
    }

    .form-box h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .status {
      text-align: center;
      font-weight: bold;
      margin-top: 10px;
    }

    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <header>
    <div class="logo">🚌 Track Way</div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="admin_dashboard.html">Admin Dashboard</a>
      <a href="change_password.html" class="active">Change Password</a>
    </nav>
  </header>

  <main>
    <div class="form-box">
      <h2>Change Password</h2>

      <input type="password" id="old_password" placeholder="Old Password" />
      <input type="password" id="new_password" placeholder="New Password" />
      <input type="password" id="confirm_password" placeholder="Confirm New Password" />

      <button onclick="changePassword()">Change Password</button>

      <p id="status" class="status"></p>
    </div>
  </main>

  <footer>
    <p style="text-align: center;">&copy; 2025 SAAC Softwares. All rights reserved.</p>
  </footer>

  <script>
    function changePassword() {
      const old_password = document.getElementById("old_password").value.trim();
      const new_password = document.getElementById("new_password").value.trim();
      const confirm_password = document.getElementById("confirm_password").value.trim();
      const status = document.getElementById("status");

      if (!old_password || !new_password || !confirm_password) {
        status.innerText = "Please fill in all fields.";
        status.className = "status error";
        return;
      }

      if (new_password !== confirm_password) {
        status.innerText = "New passwords do not match.";
        status.className = "status error";
        return;
      }

      fetch("http://192.168.29.233:5000/change_password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ old_password, new_password })
      })
      .then(res => res.json())
      .then(data => {
        if (data.message) {
          status.innerText = data.message;
          status.className = "status success";
        } else {
          status.innerText = data.error || "Failed to update.";
          status.className = "status error";
        }
      })
      .catch(() => {
        status.innerText = "Server error.";
        status.className = "status error";
      });
    }
  </script>
</body>
</html>
