<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trip Logger</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <style>
    input[type="text"],
    input[type="number"],
    select,
    button {
      border: 2px solid #000;
      padding: 10px;
      width: 100%;
      border-radius: 10px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      font-size: 1rem;
    }

    input[type="text"]:hover,
    input[type="number"]:hover,
    select:hover {
      border-color: #005eff;
      box-shadow: 0 0 5px rgba(0, 94, 255, 0.5);
    }

    button:hover {
      background-color: #005eff;
      color: white;
      box-shadow: 0 0 10px rgba(0, 94, 255, 0.6);
    }
  </style>
  <script>
    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          document.getElementById("latitude").value = pos.coords.latitude;
          document.getElementById("longitude").value = pos.coords.longitude;
          document.getElementById("trip-form").style.display = "block";
          document.getElementById("gps-msg").style.display = "none";
        }, () => {
          alert("Location access denied. You must allow location to log a trip.");
        });
      } else {
        alert("Geolocation is not supported by your browser.");
      }
    }

    window.onload = getLocation;
  </script>
</head>
<body>
  <header>
    <div class="logo">🚌 Track Way</div>
    <nav>
      <a href="{{ url_for('home') }}">Dashboard</a>
      <a href="{{ url_for('trip_logger') }}">Trip Logger</a>
      <a href="{{ url_for('view_logs_page') }}">View Logs</a>
      <a href="{{ url_for('attendance') }}">Attendance</a>
      <a href="{{ url_for('attendance_viewer') }}">Attendance Viewer</a>
      <a href="{{ url_for('admin_login_page') }}">Admin</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>📝 Trip Logging</h1>
      <p>Please allow GPS location to log van arrival odometer readings.</p>
    </section>

    <section class="form-section">
      <div class="form-box">
        <p id="gps-msg">📍 Waiting for location permission...</p>

        <form method="POST" id="trip-form" style="display:none;">
          <label for="van_id">Enter Van ID:</label>
          <input type="text" name="van_id" placeholder="Enter Van ID" required />

          <label for="odometer">Arrival Odometer:</label>
          <input type="number" name="odometer" required />

          <input type="hidden" name="latitude" id="latitude">
          <input type="hidden" name="longitude" id="longitude">

          <button type="submit">Log Trip</button>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Track Way by SAAC Softwares</p>
  </footer>
</body>
</html>
